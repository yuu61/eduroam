---
- name: Check role variables
  ansible.builtin.assert:
    that:
      - radius_test_client_radius_server is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - radius_test_client_radius_secret | length > 0
      - radius_test_client_user | length > 0
      - radius_test_client_password | length > 0
      - "'\"' not in radius_test_client_password"
      - >-
        [radius_test_client_radius_secret, radius_test_client_user, radius_test_client_password]
        | select('search', '[\n\r]') | list | length == 0
    fail_msg: >-
      radius_test_client_* 変数（RADIUS サーバの IPv4 アドレス、共有シークレット、テストユーザー）を設定してください。
      値に改行、パスワードに二重引用符は使えません。
    quiet: true

- name: Install test tools
  ansible.builtin.apt:
    name: "{{ radius_test_client_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create test configuration directory
  ansible.builtin.file:
    path: "{{ radius_test_client_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy RADIUS server CA certificate
  ansible.builtin.copy:
    src: "{{ radius_test_client_ca_src }}"
    dest: "{{ radius_test_client_conf_dir }}/ca.crt"
    owner: root
    group: root
    mode: "0644"
  when: radius_test_client_ca_src | length > 0

- name: Write test configuration
  ansible.builtin.template:
    src: "{{ radius_test_client_conf.src }}"
    dest: "{{ radius_test_client_conf_dir }}/{{ radius_test_client_conf.dest }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - src: test.env.j2
      dest: test.env
    - src: eapol_test.conf.j2
      dest: eapol_test.conf
      identity: "{{ radius_test_client_user }}"
      password: "{{ radius_test_client_password }}"
    - src: eapol_test.conf.j2
      dest: eapol_test-wrong-password.conf
      identity: "{{ radius_test_client_user }}"
      password: wrong-password-for-test
    - src: eapol_test.conf.j2
      dest: eapol_test-foreign-realm.conf
      identity: "{{ radius_test_client_user | regex_replace('@.*$', '') }}@{{ radius_test_client_foreign_realm }}"
      password: "{{ radius_test_client_password }}"
  loop_control:
    loop_var: radius_test_client_conf
    label: "{{ radius_test_client_conf.dest }}"
  no_log: true

- name: Install test runner
  ansible.builtin.copy:
    src: eduroam-test-all.sh
    dest: /usr/local/bin/eduroam-test-all
    owner: root
    group: root
    mode: "0755"
...
