---
- name: Check role variables
  ansible.builtin.assert:
    that:
      - test_client_radius_server is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
      - test_client_radius_secret | length > 0
      - test_client_user | length > 0
      - test_client_password | length > 0
      - "'\"' not in test_client_password"
    fail_msg: >-
      test_client_* 変数（RADIUS サーバの IPv4 アドレス、共有シークレット、テストユーザー）を設定してください。
      パスワードに二重引用符は使えません。
    quiet: true

- name: Install test tools
  ansible.builtin.apt:
    name: "{{ test_client_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create test configuration directory
  ansible.builtin.file:
    path: "{{ test_client_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy RADIUS server CA certificate
  ansible.builtin.copy:
    src: "{{ test_client_ca_src }}"
    dest: "{{ test_client_conf_dir }}/ca.crt"
    owner: root
    group: root
    mode: "0644"
  when: test_client_ca_src | length > 0

- name: Write test configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ test_client_conf_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - src: test.env.j2
      dest: test.env
    - src: eapol_test.conf.j2
      dest: eapol_test.conf
      identity: "{{ test_client_user }}"
      password: "{{ test_client_password }}"
    - src: eapol_test.conf.j2
      dest: eapol_test-wrong-password.conf
      identity: "{{ test_client_user }}"
      password: wrong-password-for-test
    - src: eapol_test.conf.j2
      dest: eapol_test-foreign-realm.conf
      identity: "{{ test_client_user | regex_replace('@.*$', '') }}@{{ test_client_foreign_realm }}"
      password: "{{ test_client_password }}"
  loop_control:
    label: "{{ item.dest }}"
  no_log: true

- name: Install test runner
  ansible.builtin.copy:
    src: eduroam-test-all.sh
    dest: /usr/local/bin/eduroam-test-all
    owner: root
    group: root
    mode: "0755"
