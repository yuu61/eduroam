---
# 設定検証（freeradius -C）に通った場合のみ再起動する
- name: Validate FreeRADIUS configuration
  ansible.builtin.command:
    cmd: "{{ freeradius_binary }} -Cx -lstdout"
  environment: "{{ _freeradius_env }}"
  changed_when: false
  listen: Restart FreeRADIUS

- name: Restart FreeRADIUS service
  ansible.builtin.systemd_service:
    name: "{{ freeradius_service }}"
    state: restarted
    daemon_reload: true
  listen: Restart FreeRADIUS
...
