# Makefile が ANSIBLE_CONFIG でこのファイルを指定する
# （WSL の /mnt/c 配下はワールド書き込み可能なため、カレントディレクトリの ansible.cfg は読み込まれない）
[defaults]
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False
callback_result_format = yaml
ansible_managed = Managed by Ansible - do not edit by hand

[ssh_connection]
pipelining = True
